version: "3.8"

services:
  rembg-frontend:
    image: kunmhing/rembg-frontend:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   target: runner
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Backend Configuration
      - BACKEND_URL=${BACKEND_URL}
      # Google Ads Configuration
      - NEXT_PUBLIC_ADSENSE_PUBLISHER_ID=${NEXT_PUBLIC_ADSENSE_PUBLISHER_ID}
      - NEXT_PUBLIC_ADSENSE_HEADER_SLOT=${NEXT_PUBLIC_ADSENSE_HEADER_SLOT}
      - NEXT_PUBLIC_ADSENSE_SIDEBAR_SLOT=${NEXT_PUBLIC_ADSENSE_SIDEBAR_SLOT}
      - NEXT_PUBLIC_ADSENSE_CONTENT_SLOT=${NEXT_PUBLIC_ADSENSE_CONTENT_SLOT}
      - NEXT_PUBLIC_ADSENSE_FOOTER_SLOT=${NEXT_PUBLIC_ADSENSE_FOOTER_SLOT}
      - NEXT_PUBLIC_ADSENSE_MOBILE_SLOT=${NEXT_PUBLIC_ADSENSE_MOBILE_SLOT}
      # Analytics Configuration
      - NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${NEXT_PUBLIC_GOOGLE_ANALYTICS_ID}
    # Alternative: Use env_file for cleaner configuration
    # env_file:
    #   - .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rembg-network

  rembg-backend:
    image: kunmhing/rembg-backend:latest
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped
    networks:
      - rembg-network

  # Nginx reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - rembg-frontend
  #   restart: unless-stopped
  #   networks:
  #     - rembg-network

networks:
  rembg-network:
    driver: bridge
